<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#512BD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B5CF8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="160" fill="url(#bg)" rx="12"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="160" fill="url(#accent)" rx="3"/>

  <!-- Dot grid decoration (top right) -->
  <g opacity="0.07" fill="#7B5CF8">
    <circle cx="780" cy="20" r="2"/><circle cx="800" cy="20" r="2"/><circle cx="820" cy="20" r="2"/><circle cx="840" cy="20" r="2"/><circle cx="860" cy="20" r="2"/>
    <circle cx="780" cy="38" r="2"/><circle cx="800" cy="38" r="2"/><circle cx="820" cy="38" r="2"/><circle cx="840" cy="38" r="2"/><circle cx="860" cy="38" r="2"/>
    <circle cx="780" cy="56" r="2"/><circle cx="800" cy="56" r="2"/><circle cx="820" cy="56" r="2"/><circle cx="840" cy="56" r="2"/><circle cx="860" cy="56" r="2"/>
    <circle cx="780" cy="74" r="2"/><circle cx="800" cy="74" r="2"/><circle cx="820" cy="74" r="2"/><circle cx="840" cy="74" r="2"/><circle cx="860" cy="74" r="2"/>
    <circle cx="780" cy="92" r="2"/><circle cx="800" cy="92" r="2"/><circle cx="820" cy="92" r="2"/><circle cx="840" cy="92" r="2"/><circle cx="860" cy="92" r="2"/>
  </g>

  <!-- Name -->
  <text x="50" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="-1">Omar Alfarouk</text>

  <!-- Accent underline under name -->
  <rect x="50" y="80" width="260" height="3" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Title -->
  <text x="50" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#7d8590" letter-spacing="0.5">Backend .NET Developer</text>

  <!-- Separator dot -->
  <circle cx="250" cy="107" r="2.5" fill="#512BD4" opacity="0.6"/>

  <!-- Subtitle right of dot -->
  <text x="263" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#7d8590" letter-spacing="0.5">Microservices · Clean Architecture</text>

  <!-- Bottom tagline -->
  <text x="50" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#30363d" letter-spacing="0.8">EGYPT  ·  ASP.NET CORE  ·  SHIPS TO PRODUCTION</text>
</svg>
